<path d="M595.5 69 l7 7 l-7 7" fill="none" stroke="#56605b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="820.5" y="44.5" width="179" height="210" rx="12" fill="#161b22" stroke="#30363d"/>
