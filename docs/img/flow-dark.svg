<text x="52" y="81.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Start a plan</text>
<rect x="16" y="102" width="82.8" height="24" rx="6" fill="#163324"/><text x="57.4" y="118.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#6fcf97" text-anchor="middle">/new-plan</text>
<text x="16" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">Say the idea.</text>
