<rect x="881.6" y="5" width="56.8" height="22" rx="11" fill="#262b29"/><text x="910.0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#aab4af" text-anchor="middle" letter-spacing=".06em">DONE</text>
