<text x="16" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">and opens an issue.</text>
<rect x="205.5" y="44.5" width="179" height="210" rx="12" fill="#161b22" stroke="#30363d"/>
<circle cx="235" cy="76" r="14" fill="#3a2e10"/>
<text x="235" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e3b341" text-anchor="middle">2</text>
<text x="257" y="81.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Shape it</text>
<rect x="221" y="102" width="97.2" height="24" rx="6" fill="#163324"/><text x="269.6" y="118.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#6fcf97" text-anchor="middle">/grill-plan</text>
<rect x="221" y="132" width="75.6" height="24" rx="6" fill="#163324"/><text x="258.8" y="148.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#6fcf97" text-anchor="middle">/sandbox</text>
<text x="221" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">Think it through.</text>
<text x="221" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">Each choice becomes</text>
