<path d="M232 238 a5 5 0 1 1 -1.5 -3.6" fill="none" stroke="#e3b341" stroke-width="1.6" stroke-linecap="round"/><path d="M232.5 231 v3.2 h-3.2" fill="none" stroke="#e3b341" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="239" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e3b341" text-anchor="start">over many days</text>
<path d="M185.5 69 l7 7 l-7 7" fill="none" stroke="#56605b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="410.5" y="44.5" width="179" height="210" rx="12" fill="#161b22" stroke="#30363d"/>
<circle cx="440" cy="76" r="14" fill="#132a4a"/>
<text x="440" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#79b8ff" text-anchor="middle">3</text>
<text x="462" y="81.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Finalize</text>
<rect x="426" y="102" width="118.8" height="24" rx="6" fill="#163324"/><text x="485.4" y="118.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#6fcf97" text-anchor="middle">/finalize-plan</text>
<text x="426" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">Claude checks the plan.</text>
<text x="426" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">You agree where</text>
<text x="426" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">the build stops.</text>
<path d="M390.5 69 l7 7 l-7 7" fill="none" stroke="#56605b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="615.5" y="44.5" width="179" height="210" rx="12" fill="#161b22" stroke="#30363d"/>
<circle cx="645" cy="76" r="14" fill="#163324"/>
