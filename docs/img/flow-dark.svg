<text x="872" y="81.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Close</text>
<rect x="836" y="102" width="86.39999999999999" height="24" rx="6" fill="#2b2342"/><text x="879.2" y="118.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#b9a6ef" text-anchor="middle" letter-spacing=".05em">YOU MERGE</text>
<rect x="836" y="132" width="82.8" height="24" rx="6" fill="#163324"/><text x="877.4" y="148.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#6fcf97" text-anchor="middle">/progress</text>
<text x="836" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">You merge the PR</text>
<text x="836" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">and say “mark done”.</text>
<text x="836" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">The issue closes.</text>
