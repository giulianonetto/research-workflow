<text x="667" y="81.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Build</text>
<rect x="631" y="102" width="126.0" height="24" rx="6" fill="#163324"/><text x="694.0" y="118.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#6fcf97" text-anchor="middle">/implement-next</text>
<text x="631" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">Claude builds up to</text>
<text x="631" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">the next stop: one</text>
<text x="631" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa59f" text-anchor="start">commit per step.</text>
<line x1="631" y1="224" x2="779" y2="224" stroke="#30363d" stroke-dasharray="3 3"/>
<path d="M642 238 a5 5 0 1 1 -1.5 -3.6" fill="none" stroke="#6fcf97" stroke-width="1.6" stroke-linecap="round"/><path d="M642.5 231 v3.2 h-3.2" fill="none" stroke="#6fcf97" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
